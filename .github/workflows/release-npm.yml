name: Release (npm)

# Publishes workspace packages to the npm registry on manual trigger.
#
# Flow (manual, single dispatch):
#   Triggered by a maintainer from the Actions tab ("Run workflow"). A single
#   run does both versioning and publishing:
#     1. Run the full quality gates + pre-publish validation.
#     2. `changeset version` consumes pending changesets, bumps versions, and
#        updates CHANGELOGs.
#     3. If anything changed, commit and push the version bump back to main
#        (using the built-in GITHUB_TOKEN), so the repo and the registry stay
#        in sync. If nothing changed, the run ends — there was nothing to ship.
#     4. `bun scripts/stage-publish.mjs` packs each package, stages via
#        `npm stage publish`, then approves via the npm registry API. This
#        two-phase flow is required by the token's staging policy.
#   A `@byfriends/cli@*` tag then triggers the existing release.yml, which
#   builds the native binaries and creates the GitHub Release. The two workflows
#   connect through that tag — no manual coordination needed.
#
# Why version runs inside the workflow (not via a changesets/action PR):
#   changesets/action's default mode opens a "Version Packages" PR on every
#   push, which fits an auto-release flow but not a single manual dispatch.
#   Doing `changeset version` + commit + publish explicitly keeps one manual
#   click as one complete release.
#
# Why a guard step before publish: bare `npm publish` would ship
# workspace:/catalog: specifiers verbatim and break npm installs
# (EUNSUPPORTEDPROTOCOL). We double-check packed manifests with
# `bun run pubcheck:manifest` (`bun pm pack`) so a regression never reaches
# the registry.
#
# Toolchain (PRD-0020 / ADR 0028 / #216 / #217): install + quality gates use
# Bun 1.3.14. Publish goes through `bun scripts/stage-publish.mjs`:
#   - The script prepares publish manifests (rewrites workspace:/catalog:
#     specifiers + expands publishConfig), packs each package, stages via
#     `npm stage publish`, then approves via the npm registry API.
#   - This flow is required because the NPM_TOKEN uses an automation token
#     with staging policy (E_STAGE_REQUIRED). Direct `npm publish` is
#     rejected; the two-phase stage → approve is the supported path.
#   - Residual root `packageManager: pnpm@…` / `pnpm-lock.yaml` may still
#     exist; do not reintroduce pnpm/action-setup as the install main path.

on:
  workflow_dispatch:

permissions:
  contents: write # commit the version bump + push tags
  id-token: write # reserved for future provenance (currently publishConfig.provenance: false)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets needs full history to compute versions

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Registry auth for publish (changeset → pack/publish). setup-node writes
      # .npmrc with NODE_AUTH_TOKEN; Bun also honors NPM_TOKEN / NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@byfriends'

      - run: bun install --frozen-lockfile

      # Quality gates — mirror the local `bun run publish` pipeline (minus the
      # final changeset publish, which runs in the Publish step below).
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run sherif
      - run: bun run test
      - run: bun run build

      # Pre-publish validation: published-layout checks (publint + attw) and a
      # guard against workspace:/catalog: leaking into shipped manifests.
      - run: bun run lint:pkg
      - run: bun run pubcheck:manifest

      # Consume pending changesets: bump versions and update CHANGELOGs.
      - name: Version
        run: bunx changeset version

      # Commit the version bump back to main so the repo reflects what was
      # published. If version produced no changes, there was nothing to release
      # — publish below is a safe no-op in that case.
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No version changes to commit."
          else
            git add -A
            git commit -m "chore: release packages"
            git push
          fi

      - name: Publish (npm staging → approve)
        # Prepares manifests (workspace:/catalog: rewrite + publishConfig expand),
        # packs each package, stages via `npm stage publish`, then approves via
        # the npm registry API. Required by the token's staging policy.
        run: bun scripts/stage-publish.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: '0'

      # The staging path does not create git tags (changesets used to). Create
      # package tags from the current package.json versions so the release.yml
      # binary workflow is triggered by the `@byfriends/cli@*` tag push.
      - name: Create package tags
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for pkg_json in $(find packages apps -name package.json -not -path '*/node_modules/*' -maxdepth 4); do
            name=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('$pkg_json','utf8')).name ?? '')")
            version=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('$pkg_json','utf8')).version ?? '')")
            if [[ -n "$name" && -n "$version" ]]; then
              tag="${name}@${version}"
              if ! git rev-parse "$tag" >/dev/null 2>&1; then
                git tag "$tag"
                echo "created tag $tag"
              fi
            fi
          done
        env:
          HUSKY: '0'

      # `@byfriends/cli@*` is the trigger for release.yml binaries.
      - name: Push package tags
        run: |
          set -euo pipefail
          git push --tags
        env:
          HUSKY: '0'
