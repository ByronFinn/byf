name: Release (npm)

# Publishes workspace packages to the npm registry on manual trigger.
#
# Flow (manual, single dispatch):
#   Triggered by a maintainer from the Actions tab ("Run workflow"). A single
#   run does both versioning and publishing:
#     1. Run the full quality gates + pre-publish validation.
#     2. `changeset version` consumes pending changesets, bumps versions, and
#        updates CHANGELOGs.
#     3. If anything changed, commit and push the version bump back to main
#        (using the built-in GITHUB_TOKEN), so the repo and the registry stay
#        in sync. If nothing changed, the run ends — there was nothing to ship.
#     4. `changeset publish` pushes every changed package to npm and tags it as
#        `@byfriends/<pkg>@<ver>`.
#   A `@byfriends/cli@*` tag then triggers the existing release.yml, which
#   builds the native binaries and creates the GitHub Release. The two workflows
#   connect through that tag — no manual coordination needed.
#
# Why version runs inside the workflow (not via a changesets/action PR):
#   changesets/action's default mode opens a "Version Packages" PR on every
#   push, which fits an auto-release flow but not a single manual dispatch.
#   Doing `changeset version` + commit + publish explicitly keeps one manual
#   click as one complete release.
#
# Why a guard step before publish: bare `npm publish` would ship
# workspace:/catalog: specifiers verbatim and break npm installs
# (EUNSUPPORTEDPROTOCOL). We double-check packed manifests with
# `bun run pubcheck:manifest` (`bun pm pack`) so a regression never reaches
# the registry.
#
# Credential model: npm Trusted Publishing (OIDC), no NPM_TOKEN. The registry
# stopped honouring direct publishes from granular tokens that bypass 2FA, which
# is what this workflow used up to and including the aborted 0.6.2 attempt; the
# replacement is the `id-token: write` permission plus
# `publishConfig.provenance: true` on every publishable manifest.
#
# Toolchain (PRD-0020 / ADR 0028 / #216 / #217): install + quality gates use
# Bun 1.3.14. Publish goes through `bun scripts/with-publish-manifests.mjs
# bunx changeset publish`:
#   - Bun built-in pack rewrite is the primary protocol story (validated by
#     pubcheck); changesets itself only knows pnpm/npm, so the wrapper is the
#     explicit gap-fill (protocol rewrite + publishConfig.exports overlay).
#   - The historical pnpm escape hatch (`packageManager: pnpm@…` / pnpm-lock.yaml
#     making changesets pick `pnpm publish`) is long gone — root pins
#     `bun@1.3.14` and there is no pnpm lockfile. `.changeset/config.json` now
#     also pins `npmClient: "npm"` explicitly, because the OIDC exchange exists
#     only in npm: silently falling back to another client would mean no
#     trusted publishing and a misleading E404.

on:
  workflow_dispatch:

permissions:
  contents: write # commit the version bump + push tags
  # npm Trusted Publishing (OIDC). This is NOT optional-and-not-yet-used: the
  # registry refuses direct publishes from bypass-2FA granular tokens, so this
  # permission is the credential. There is deliberately no NPM_TOKEN anywhere in
  # this job. Do not "helpfully" add one back — a token in the environment makes
  # npm use token auth and the trusted-publishing flow never engages.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets needs full history to compute versions

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Node/npm only — NOT registry auth. Passing `registry-url` + `scope` makes
      # setup-node write an `_authToken` line into a generated userconfig npmrc,
      # and npm then authenticates with the (empty) token instead of exchanging
      # the OIDC token for a short-lived publishing credential. So: pin the
      # toolchain here, and give it nothing that looks like a credential.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: bun install --frozen-lockfile

      # Quality gates — mirror the local `bun run publish` pipeline (minus the
      # final changeset publish, which runs in the Publish step below).
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run sherif
      - run: bun run test
      - run: bun run build

      # Pre-publish validation: published-layout checks (publint + attw) and a
      # guard against workspace:/catalog: leaking into shipped manifests.
      - run: bun run lint:pkg
      - run: bun run pubcheck:manifest

      # Consume pending changesets: bump versions and update CHANGELOGs.
      - name: Version
        run: bunx changeset version

      # Commit the version bump back to main so the repo reflects what was
      # published. If version produced no changes, there was nothing to release
      # — publish below is a safe no-op in that case.
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No version changes to commit."
          else
            git add -A
            git commit -m "chore: release packages"
            git push
          fi

      - name: Publish
        # Trusted publishing: npm exchanges the OIDC token that `id-token: write`
        # provides for a short-lived publishing credential, so this step must run
        # with NO registry token in its environment. `publishConfig.provenance:
        # true` on every publishable manifest is what asks npm to do that;
        # `.changeset/config.json` pins `npmClient: npm`, because changesets only
        # knows pnpm and npm and the OIDC exchange is npm-only.
        #
        # The preflight below is deliberate: a reintroduced NPM_TOKEN does not
        # fail loudly, it silently downgrades npm back to token auth and the
        # publish dies with a misleading E404 (that is exactly the failure this
        # workflow hit before migrating). Prefer a red assertion instead.
        env:
          HUSKY: '0' # skip git hooks in CI
        run: |
          set -euo pipefail
          if [[ -n "${NPM_TOKEN:-}" || -n "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::A registry token is present in this step's environment." \
              "npm Trusted Publishing requires none; remove the NPM_TOKEN /" \
              "NODE_AUTH_TOKEN wiring rather than the OIDC permission."
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::No OIDC token is available to the runner." \
              "Check that the job/workflow still declares id-token: write."
            exit 1
          fi
          bun scripts/with-publish-manifests.mjs bunx changeset publish

      # changesets creates package tags during publish but does not always push
      # them (and `@byfriends/cli@*` is the trigger for release.yml binaries).
      # Explicit push keeps registry tags and the binary release path in sync.
      - name: Push package tags
        run: |
          set -euo pipefail
          git push --tags
        env:
          HUSKY: '0'
